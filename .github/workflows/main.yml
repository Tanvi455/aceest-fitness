name: ACEest CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and test in Docker
        run: docker build --target test -t aceest-fitness:test .

      - name: Build runtime image
        run: docker build -t aceest-fitness:latest .
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow
  template:
    metadata:
      labels:
        app: aceest-shadow
    spec:
      containers:
        - name: aceest-fitness
          image: s2025tm93013/aceest-fitness:v3
          imagePullPolicy: Always
          env:
            - name: APP_VARIANT
              value: "shadow"
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow
spec:
  selector:
    app: aceest-shadow
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aceest-shadow-nginx
data:
  default.conf: |
    upstream primary {
      server aceest-service:5000;
    }

    upstream shadow {
      server aceest-shadow:5000;
    }

    server {
      listen 8080;

      location / {
        mirror /_shadow;
        mirror_request_body on;
        proxy_pass http://primary;
      }

      location = /_shadow {
        internal;
        proxy_pass http://shadow$request_uri;
        proxy_set_header X-Shadow true;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow-proxy
  template:
    metadata:
      labels:
        app: aceest-shadow-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-config
          configMap:
            name: aceest-shadow-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-proxy
spec:
  type: NodePort
  selector:
    app: aceest-shadow-proxy
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
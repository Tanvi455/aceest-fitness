apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-ab-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-ab-a
  template:
    metadata:
      labels:
        app: aceest-ab-a
    spec:
      containers:
        - name: aceest-fitness
          image: s2025tm93013/aceest-fitness:v2
          env:
            - name: APP_VARIANT
              value: "a"
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-ab-a
spec:
  type: NodePort
  selector:
    app: aceest-ab-a
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30083
---

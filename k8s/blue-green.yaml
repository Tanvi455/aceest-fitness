apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-bluegreen
      version: blue
  template:
    metadata:
      labels:
        app: aceest-bluegreen
        version: blue
    spec:
      containers:
        - name: aceest-fitness
          image: s2025tm93013/aceest-fitness:v2
          env:
            - name: APP_VARIANT
              value: "blue"
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-bluegreen
      version: green
  template:
    metadata:
      labels:
        app: aceest-bluegreen
        version: green
    spec:
      containers:
        - name: aceest-fitness
          image: s2025tm93013/aceest-fitness:v2
          env:
            - name: APP_VARIANT
              value: "green"
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-bluegreen
spec:
  type: NodePort
  selector:
    app: aceest-bluegreen
    version: blue
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30082